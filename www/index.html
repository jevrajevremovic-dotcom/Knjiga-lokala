<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Knjiga lokala</title>
<meta name="theme-color" content="#0A0F1C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark dashboard. Sidebar navigation on the left (drawer + bottom bar on phone), top bar with search,
   alerts and a quick-add button, content in panels. Tinted gradient KPI cards carry the four headline numbers. */
:root{
  --bg:#0A0F1C; --side:#0C1222; --surface:#111A2E; --surface-2:#152038; --field:#0D1528;
  --line:#1E2A44; --line-2:#2A3A5C;
  --fg:#E7ECF5; --muted:#8C99B4; --dim:#5F6C88;
  --primary:#3B82F6; --primary-hi:#5B9BFF; --primary-soft:rgba(59,130,246,.14);
  --blue:#60A5FA; --orange:#FB923C; --purple:#A78BFA; --green:#34D399; --red:#F87171; --yellow:#FBBF24;
  --l1:#60A5FA; --l2:#FB923C; --l3:#A78BFA;
  --r:14px;
  --f:"Inter","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 70% -10%,rgba(59,130,246,.10),transparent 60%),var(--bg);background-attachment:fixed;
  color:var(--fg);font:14.5px/1.45 var(--f);-webkit-tap-highlight-color:transparent;min-height:100vh}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary-hi)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));overflow-y:auto;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-weight:700;font-size:17px}
.brand .logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#60A5FA,#2563EB 55%,#7C3AED);box-shadow:0 6px 18px rgba(59,130,246,.35)}
.brand .logo svg{width:17px;height:17px;stroke:#fff}
.navgrp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600;padding:14px 10px 6px}
.nav button{width:100%;display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--muted);padding:9px 10px;border-radius:9px;cursor:pointer;font-weight:500;text-align:left}
.nav button:hover{color:var(--fg);background:rgba(255,255,255,.03)}
.nav button[aria-current="page"]{color:var(--fg);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.nav button[aria-current="page"] svg{color:var(--primary-hi)}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:rgba(248,113,113,.15);color:var(--red)}
.nav .cnt.n{background:var(--primary-soft);color:var(--primary-hi)}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.side-foot .av{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;border:1px solid var(--line-2);color:var(--primary-hi)}
.side-foot b{display:block;font-size:13.5px;font-weight:600}
.side-foot span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.side-foot span i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.scrim{display:none}

.content{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 12px 24px;
  background:rgba(10,15,28,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .menu{display:none}
.ttl{min-width:0;flex:1}
.ttl h1{font-size:19px}
.ttl small{color:var(--muted);font-size:12.5px}
.search{position:relative;margin-left:auto;width:min(320px,34vw)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim)}
.search input{padding-left:36px;background:var(--surface);border-color:var(--line)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.45);max-height:60vh;overflow:auto}
.results button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;padding:8px;border-radius:8px;cursor:pointer;text-align:left}
.results button:hover{background:rgba(255,255,255,.04)}
.results small{display:block;color:var(--muted);font-size:12px}
.iconbtn{position:relative;background:var(--surface);border:1px solid var(--line);color:var(--muted);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{color:var(--fg);border-color:var(--line-2)}
.iconbtn .dotn{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#EF4444;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.alerts{position:absolute;right:0;top:calc(100% + 8px);width:min(360px,calc(100vw - 32px));background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.45);padding:8px;z-index:40}
.alerts h3{font-size:13px;color:var(--muted);font-weight:600;padding:6px 8px 8px}
.bellwrap{position:relative}

main{padding:22px 24px 48px;display:flex;flex-direction:column;gap:18px;max-width:1440px;width:100%;margin:0 auto}

/* ---- panels ---- */
.panel{background:linear-gradient(180deg,rgba(255,255,255,.015),transparent),var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.phead h2{font-size:16px}
.phead .sub{font-size:12.5px;color:var(--muted)}
.link{background:none;border:0;color:var(--primary-hi);cursor:pointer;font-size:13px;font-weight:500;padding:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.grid-main{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:18px}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.empty{color:var(--muted);padding:14px 2px;font-size:13.5px}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kc{--c:96,165,250;position:relative;overflow:hidden;border-radius:var(--r);padding:16px 16px 0;min-height:132px;display:flex;flex-direction:column;
  border:1px solid rgba(var(--c),.30);
  background:radial-gradient(130% 130% at 0% 0%,rgba(var(--c),.42),rgba(var(--c),.10) 55%,rgba(var(--c),.04)),var(--surface)}
.kc.orange{--c:251,146,60}.kc.purple{--c:167,139,250}.kc.green{--c:52,211,153}.kc.red{--c:248,113,113}
.kc .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kc .t{font-size:13px;font-weight:500;color:#DCE4F3}
.kc .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.kc .v small{font-size:13px;font-weight:500;color:rgba(231,236,245,.7);margin-left:3px}
.kc .h{font-size:12.5px;color:rgba(231,236,245,.75);margin-top:2px}
.kc svg.sp{position:absolute;right:0;bottom:0;width:58%;height:56px}
.badge{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.badge.up{color:#6EE7B7}.badge.down{color:#FCA5A5}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.st .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:rgba(var(--c),.14);color:rgb(var(--c));border:1px solid rgba(var(--c),.25)}
.st b{display:block;font-size:18px;font-weight:700;letter-spacing:-.01em}
.st span{font-size:12.5px;color:var(--muted)}

/* chart */
.chart{position:relative;padding-left:46px}
.chart svg{display:block;width:100%;height:210px;overflow:visible}
.plot{position:relative}
.ylab{position:absolute;left:-46px;width:40px;text-align:right;font-size:11px;color:var(--dim);transform:translateY(-50%)}
.xlab{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:8px}
.legend{display:flex;gap:18px;flex-wrap:wrap}
.legend div{font-size:12.5px;color:var(--muted)}
.legend b{display:block;font-size:17px;color:var(--fg);font-weight:700;margin-top:2px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}

/* activity */
.act{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:rgba(var(--c),.14);color:rgb(var(--c));border:1px solid rgba(var(--c),.28)}
.act .tx{flex:1;min-width:0}
.act .tx b{display:block;font-weight:600;font-size:13.5px}
.act .tx small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .am{font-weight:600;font-size:13.5px}
.c-blue{--c:96,165,250}.c-orange{--c:251,146,60}.c-purple{--c:167,139,250}.c-green{--c:52,211,153}.c-red{--c:248,113,113}.c-yellow{--c:251,191,36}

/* forms */
form.entry{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0;width:100%;color:var(--fg)}
input::placeholder{color:var(--dim)}
input.amt{text-align:right;font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
input[type=date],input[type=month]{color-scheme:dark}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--primary);color:#fff;border:0;border-radius:9px;padding:9px 15px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:0 6px 16px rgba(59,130,246,.25)}
.btn:hover{background:var(--primary-hi)}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line-2);box-shadow:none}
.btn.ghost:hover{border-color:var(--primary)}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(248,113,113,.35);box-shadow:none}
.btn.danger:hover{background:rgba(248,113,113,.1)}
.x{background:none;border:0;color:var(--dim);cursor:pointer;padding:4px 7px;border-radius:7px;font-size:16px;line-height:1}
.x:hover{color:var(--red);background:rgba(248,113,113,.1)}
.x.ed:hover{color:var(--primary-hi);background:var(--primary-soft)}
.rowacts{display:inline-flex;gap:2px;white-space:nowrap}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar input[type=month]{width:auto;padding:6px 10px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px;flex-wrap:wrap}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:rgba(255,255,255,.015)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
td.mut{color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:7px;background:rgba(var(--c),.13);color:rgb(var(--c));border:1px solid rgba(var(--c),.28);white-space:nowrap}
select.pillsel{width:auto;padding:4px 26px 4px 10px;font-size:12.5px;font-weight:600;border-radius:8px;background-color:rgba(var(--c),.13);color:rgb(var(--c));border-color:rgba(var(--c),.35)}
.chip{display:inline-block;padding:2px 9px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line-2);font-size:12px;font-weight:500}
.pos{color:var(--green)} .neg{color:var(--red)}

/* lokali */
.lokali{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lokal{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--field)}
.lokal .nm{font-size:13px;color:var(--muted);display:flex;align-items:center}
.lokal .v{font-size:20px;font-weight:700;margin-top:4px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--c);border-radius:3px}
.total{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;margin-top:12px;gap:8px;flex-wrap:wrap;
  background:linear-gradient(90deg,var(--primary-soft),transparent);border:1px solid rgba(59,130,246,.25)}
.total .v{font-size:20px;font-weight:700}
.total.warn{background:linear-gradient(90deg,rgba(251,146,60,.14),transparent);border-color:rgba(251,146,60,.3)}
.total.bad{background:linear-gradient(90deg,rgba(248,113,113,.14),transparent);border-color:rgba(248,113,113,.3)}

.cats{display:flex;flex-direction:column;gap:9px}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center;font-size:13.5px}
.catrow .bar{grid-column:1/-1;margin-top:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:2px;padding:4px 4px 4px 11px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:999px;font-size:13px}

/* cards (dobavljači, radnici) */
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.card + .card{margin-top:10px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;flex-wrap:wrap}
.card-head:hover{background:rgba(255,255,255,.015)}
.card-head .nm{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.card-head .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.card-head .big{font-size:17px;font-weight:700;text-align:right}
.card-head .big small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.card-body{border-top:1px solid var(--line);padding:16px;background:rgba(0,0,0,.12);display:flex;flex-direction:column;gap:14px}
.sec-title{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:rgba(var(--c),.16);color:rgb(var(--c));border:1px solid rgba(var(--c),.3)}
details.past{margin-top:6px}
details.past summary{cursor:pointer;color:var(--muted);font-weight:500;padding:8px 0;list-style:none;display:flex;align-items:center;gap:8px}
details.past summary::-webkit-details-marker{display:none}
details.past summary::before{content:"›";display:inline-block;transition:transform .15s;font-size:18px;line-height:1}
details.past[open] summary::before{transform:rotate(90deg)}
.card.gone{opacity:.75}

/* imenik */
.contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.contact{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.contact .row{display:flex;gap:12px;align-items:center}
.contact .row > div{flex:1;min-width:0}
.contact b{display:block;font-weight:600;overflow-wrap:anywhere}
.contact .tel{color:var(--muted);font-size:13px}
.contact p{margin:0;font-size:13px;color:#C3CCDD;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 10px;overflow-wrap:anywhere}
.contact .acts{display:flex;gap:8px;align-items:center}
.contact .acts .btn{flex:1;text-decoration:none}

/* zadaci */
.task{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:19px;height:19px;accent-color:var(--primary);flex:none}
.task .t{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .due{font-size:12px;color:var(--muted)}
.task .due.late{color:var(--red);font-weight:600}
.prio{width:4px;align-self:stretch;border-radius:4px;flex:none;background:var(--line-2)}
.prio.h{background:var(--red)} .prio.m{background:var(--orange)}

/* kurs */
.fx-row{display:grid;grid-template-columns:46px minmax(0,1fr) 116px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.fx-row:last-of-type{border-bottom:0}
.fx-row .code{font-weight:700}
.fx-row .nm{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-row input{padding:6px 9px}
.calc{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px;margin-top:14px}
.calc .out{grid-column:1/-1;font-size:16px;font-weight:600}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}

/* info: vreme, kurs, berza, kripto, vesti */
.info{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.9fr) minmax(0,1.2fr) minmax(0,1.2fr);gap:16px}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.icard .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.icard .hd b{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.icard .hd small{font-size:11.5px;color:var(--dim);text-align:right}
.icard.wx{background:radial-gradient(120% 120% at 100% 0%,rgba(96,165,250,.22),transparent 60%),var(--surface)}
.wx-now{display:flex;align-items:center;gap:12px}
.wx-now .em{font-size:40px;line-height:1}
.wx-now .t{font-size:32px;font-weight:700;letter-spacing:-.02em}
.wx-now .d{font-size:12.5px;color:var(--muted)}
.wx-days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.wx-days div{background:var(--field);border:1px solid var(--line);border-radius:9px;padding:6px 4px;text-align:center;font-size:12px;color:var(--muted)}
.wx-days b{display:block;color:var(--fg);font-size:12.5px;font-weight:600}
.wx-city{display:flex;gap:6px}
.wx-city input{padding:6px 9px;font-size:13px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 56px auto;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow.k{grid-template-columns:minmax(0,1fr) auto}
.qrow .n{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.qrow .n small{display:block;color:var(--dim);font-size:11px;font-weight:400}
.qrow svg{width:56px;height:22px;display:block}
.qrow .p{text-align:right;font-weight:600}
.qrow .p small{display:block;font-size:11.5px}
.news{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.nitem{display:block;padding:9px 0;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}
.nitem:last-child{border-bottom:0}
.nitem:hover b{color:var(--primary-hi)}
.nitem b{font-weight:500;font-size:13.5px;line-height:1.35;display:block}
.nitem small{color:var(--dim);font-size:11.5px}

/* asistent */
.chat{display:flex;flex-direction:column;gap:12px}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:min(60vh,560px);overflow-y:auto;padding:4px 2px}
.msg{max-width:min(620px,88%);padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line-2);border-bottom-left-radius:4px}
.msg.typing{color:var(--muted);font-style:italic}
.msg .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.msg .acts a{text-decoration:none}
.msg .src{display:block;margin-top:6px;font-size:11px;color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .chip{cursor:pointer;color:var(--fg);padding:5px 10px;border-radius:999px}
.chips .chip:hover{border-color:var(--primary)}

/* izbor kripta i berze */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,6,14,.65);display:grid;place-items:center;padding:16px}
.sheet{width:min(560px,100%);max-height:min(82vh,760px);display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--line-2);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.sh-head{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sh-head h2{font-size:16px}
.sh-head p{margin:0;font-size:12.5px;color:var(--muted)}
.sh-body{overflow:auto;padding:4px 16px 8px;overscroll-behavior:contain}
.sh-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.pgrp{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:600;padding:12px 0 4px}
.pick{display:flex;align-items:center;gap:11px;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.pick:last-child{border-bottom:0}
.pick input{width:18px;height:18px;accent-color:var(--primary);flex:none}
.pick span{flex:1;min-width:0}
.pick small{display:block;color:var(--dim);font-size:11.5px}
.pick em{font-style:normal;font-size:12.5px;text-align:right}

.backup{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.backup p{flex-basis:100%;margin:0 0 4px;color:var(--muted);font-size:13.5px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--surface-2);border:1px solid var(--line-2);color:var(--fg);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1}
.toast.undo{display:flex;gap:14px;align-items:center;pointer-events:none;bottom:calc(78px + env(safe-area-inset-bottom,0px))}
.toast.undo.on{pointer-events:auto}
.toast.undo .link{font-weight:700}

/* PIN */
.lock{position:fixed;inset:0;z-index:100;background:radial-gradient(800px 500px at 50% 0%,rgba(59,130,246,.18),transparent 60%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
.lock h2{font-size:20px}
.lock p{margin:0;color:var(--muted);font-size:13.5px;text-align:center;max-width:320px}
.pdots{display:flex;gap:14px}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2)}
.pdots i.on{background:var(--primary);border-color:var(--primary)}
.pdots.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-size:24px;font-weight:600;cursor:pointer}
.pad button:active{background:var(--surface-2)}
.pad button.ghost{border:0;background:none;font-size:15px;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);border:1px solid rgba(251,191,36,.35);background:linear-gradient(90deg,rgba(251,191,36,.12),transparent);font-size:13.5px}

.bottomnav{display:none}

@media (max-width:1180px){
  .kpis,.stats,.info{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-main{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;transform:translateX(-100%);transition:transform .22s ease;box-shadow:20px 0 50px rgba(0,0,0,.5)}
  .app.drawer .side{transform:none}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:25}
  .topbar{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .topbar .menu{display:grid}
  .grid2{grid-template-columns:minmax(0,1fr)}
  main{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:22;background:rgba(12,18,34,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bottomnav button{flex:1;background:none;border:0;padding:6px 2px;border-radius:10px;font-size:11px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  .bottomnav button svg{width:21px;height:21px}
  .bottomnav button[aria-current="page"]{color:var(--fg);background:var(--primary-soft)}
  .bottomnav button[aria-current="page"] svg{color:var(--primary-hi)}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .toast.undo{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:640px){
  .search{display:none}
  .quick span{display:none}
  .quick{padding:9px 11px}
  .ttl small{display:none}
  .lokali{grid-template-columns:minmax(0,1fr)}
  .info,.news{grid-template-columns:minmax(0,1fr)}
  .modal{place-items:end stretch;padding:0}
  .sheet{width:100%;max-height:88vh;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .kpis,.stats{gap:10px}
  .kc{padding:12px 12px 0;min-height:118px}
  .kc .v{font-size:19px;white-space:normal;overflow-wrap:anywhere}
  .kc .t{font-size:12px}
  .kc .h{font-size:11.5px}
  .kc svg.sp{height:40px;width:70%;opacity:.8}
  .badge{font-size:10.5px;padding:1px 5px}
  .st{padding:12px;gap:10px}
  .st .ic{width:32px;height:32px}
  .st b{font-size:15px}
  .panel{padding:14px}
  .chart{padding-left:38px}
  .ylab{left:-40px;width:34px}
  .chart svg{height:170px}
  .fx-row{grid-template-columns:42px minmax(0,1fr) 104px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<div class="app" id="app">
  <aside class="side" id="side" aria-label="Glavni meni">
    <div class="brand"><span class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/></svg></span>Knjiga lokala</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><span class="av"><svg class="i" viewBox="0 0 24 24"><path d="M3 21V8l9-5 9 5v13M9 21v-6h6v6"/></svg></span><div><b id="firmname">Moji lokali</b><span id="sync"><i></i>Sačuvano na uređaju</span></div></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="content">
    <header class="topbar">
      <button class="iconbtn menu" id="menu" aria-label="Otvori meni"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="ttl"><h1 id="title">Pregled</h1><small id="subtitle"></small></div>
      <div class="search"><svg class="i" viewBox="0 0 24 24"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Pretraga: kontakt, dobavljač, radnik…" autocomplete="off" aria-label="Pretraga"><div class="results" id="results" hidden></div></div>
      <button class="iconbtn" data-tab="asistent" aria-label="Asistent" title="Asistent"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4zM19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8zM5 16l.6 1.4 1.4.6-1.4.6L5 20l-.6-1.4L3 18l1.4-.6z"/></svg></button>
      <div class="bellwrap"><button class="iconbtn" id="bell" aria-label="Upozorenja"><svg class="i" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dotn" id="belln" hidden></span></button>
        <div class="alerts" id="alerts" hidden></div></div>
      <button class="btn quick" id="quick"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span id="quickl">Dodaj pazar</span></button>
    </header>
    <main id="main"></main>
  </div>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Brzi meni"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="toast undo" id="undo" role="status" aria-live="polite"><span>Obrisano</span><button class="link" data-undo>Poništi</button></div>
<div class="lock" id="lock" hidden></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n, d=2) => (Number(n)||0).toLocaleString("sr-Latn-RS",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt0 = n => fmt(n,0);
const short = v => { const a=Math.abs(v); return a>=1e6 ? fmt(v/1e6,1)+" M" : a>=1e3 ? fmt0(v/1e3)+" k" : fmt0(v); };
// Serbian input: "12.500,50" and "1.200.000" use dots for thousands; "12.5" stays a decimal.
const parseNum = s => { if (typeof s === "number") return s; s = String(s||"").trim().replace(/\s/g,""); if(!s) return NaN;
  if (s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  return parseFloat(s); };
const pad = n => String(n).padStart(2,"0");
const today = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const thisMonth = () => today().slice(0,7);
const daysIn = m => { const [y,mm]=m.split("-").map(Number); return new Date(y,mm,0).getDate(); };
const prevMonth = m => { let [y,mm]=m.split("-").map(Number); mm--; if(!mm){mm=12;y--;} return y+"-"+pad(mm); };
const addDays = (d,n) => { const x=new Date(d+"T12:00:00"); x.setDate(x.getDate()+n); return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()); };
const fdate = s => s ? s.split("-").reverse().join(".")+"." : "";
const MONTHS = ["januar","februar","mart","april","maj","jun","jul","avgust","septembar","oktobar","novembar","decembar"];
const mname = m => { const [y,mm]=m.split("-"); return MONTHS[+mm-1]+" "+y; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const initials = s => String(s||"").split(/\s+/).filter(w=>/^[\p{L}\d]/u.test(w)).slice(0,2).map(w=>w[0]).join("").toUpperCase() || "?";
const sum = (arr, f) => arr.reduce((a,x)=>a+(Number(f(x))||0),0);
let toastT; const toast = msg => { const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2200); };

const CURRENCIES = [
  ["RSD","Srpski dinar"],["EUR","Evro"],["USD","Američki dolar"],["CHF","Švajcarski franak"],
  ["GBP","Britanska funta"],["BAM","Konvertibilna marka"],["HUF","Mađarska forinta (100)"],["MKD","Makedonski denar"]
];
const DEFAULT_CATS = ["Namirnice","Piće","Komunalije","Gorivo","Plate","Kirija","Održavanje","Higijena","Ostalo"];

/* ---------- data layer: everything lives on this device (localStorage) ---------- */
const COLS = ["pazari","troskovi","zadaci","dobavljaci","racuni","uplate","settings","krediti","lizing","imenik","gotovina","radnici","avansi","isplate","ponavljajuci"];
const state = Object.fromEntries(COLS.map(c=>[c,[]]));
const LS = "knjiga-lokala-v1";
function lsLoad(){ try{ const raw=localStorage.getItem(LS); if(raw){ const o=JSON.parse(raw); COLS.forEach(c=>state[c]=o[c]||[]); } }catch(e){} }
function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify(state)); syncReminders(); return true; }catch(e){ toast("Čuvanje nije uspelo: memorija je puna."); return false; } }

async function put(col, id, data){
  const doc = {...data, id};
  const arr=state[col]; const i=arr.findIndex(x=>x.id===id); if(i>=0) arr[i]=doc; else arr.push(doc); lsSave(); enqueue(col, doc); render();
}
async function del(col, id){ removeWithUndo([[col, x=>x.id===id]]); }
/* Removes matching docs (with dependents), saves, and offers "Poništi" for a few seconds. */
const CASCADE = {
  dobavljaci: id => [["racuni", x=>x.dobavljac===id], ["uplate", x=>x.dobavljac===id]],
  radnici: id => [["avansi", x=>x.radnik===id], ["isplate", x=>x.radnik===id], ["troskovi", x=>!!x.isplata && state.isplate.some(i=>i.id===x.isplata && i.radnik===id)]],
  isplate: id => [["troskovi", x=>x.isplata===id]]
};
let lastDel = null, undoT;
function removeWithUndo(rules, msg){
  const removed = [], all = [...rules];
  rules.forEach(([col,f])=>{ if (CASCADE[col]) state[col].filter(f).forEach(d=>all.push(...CASCADE[col](d.id))); });
  all.forEach(([col,f])=>{ state[col].filter(f).forEach(d=>removed.push([col,d])); });
  all.forEach(([col,f])=>{ state[col] = state[col].filter(x=>!f(x)); });
  removed.forEach(([col,d])=>enqueue(col, d, true));
  lsSave(); render();
  lastDel = removed;
  const u = $("#undo"); u.querySelector("span").textContent = msg || "Obrisano"; u.classList.add("on");
  clearTimeout(undoT); undoT = setTimeout(()=>{ u.classList.remove("on"); lastDel = null; }, 7000);
}
function undoDelete(){
  if (!lastDel) return;
  lastDel.forEach(([col,d])=>{ if (!state[col].some(x=>x.id===d.id)){ state[col].push(d); enqueue(col, d); } });
  lastDel = null; $("#undo").classList.remove("on"); lsSave(); render(); toast("Vraćeno");
}

/* ---------- live NBS rates (kurs.resenje.org mirrors the NBS list) ---------- */
let fxLoading = false;
async function refreshRates(force){
  const s = settings(); if (!force && s.kursDatum === today()) return;
  if (fxLoading) return; fxLoading = true;
  try{
    const r = await fetch("https://kurs.resenje.org/api/v1/rates/today", {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json(); const rates = {...s.kurs}; let datum = "";
    (j.rates||[]).forEach(x=>{ if (CURRENCIES.some(c=>c[0]===x.code) && x.exchange_middle){ rates[x.code]=x.exchange_middle; datum = datum || x.date; } });
    if (!rates.EUR) throw new Error("bez EUR");
    await put("settings","kurs",{rates, datum: datum || today(), izvor:"NBS srednji kurs"});
    if (force) toast("Kurs ažuriran: "+fdate(datum));
  }catch(e){ if (force) toast("Kurs nije preuzet. Proverite internet."); }
  finally{ fxLoading = false; }
}

/* ---------- backup ---------- */
function backupJson(){ return JSON.stringify({app:"knjiga-lokala", verzija:2, napravljeno:new Date().toISOString(), podaci:state}, null, 1); }
async function exportBackup(){
  const name = "knjiga-lokala-"+today()+".json"; const json = backupJson();
  if (window.AndroidBridge){
    if (!window.AndroidBridge.shareFile(name, json)) toast("Kopija nije napravljena. Pokušajte ponovo.");
    else { setMeta({manual:Date.now()}); render(); }
    return;
  }
  setMeta({manual:Date.now()}); render();
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json],{type:"application/json"}));
  a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("Kopija sačuvana: "+name);
}
function importBackup(file){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const o = JSON.parse(rd.result); const d = o.podaci || o;
      if (!d || !Array.isArray(d.pazari)) throw 0;
      if (cloud.firma && cloud.uloga!=="vlasnik"){ toast("Samo vlasnik može da vrati kopiju u zajedničku bazu."); return; }
      const old = COLS.flatMap(c=>state[c].map(x=>[c,x]));
      COLS.forEach(c=>state[c]=Array.isArray(d[c])?d[c]:[]);
      // In the shared base the copy replaces the firm's data: upload everything, delete what the copy lacks.
      if (cloud.firma){ COLS.forEach(c=>state[c].forEach(x=>enqueue(c,x))); old.forEach(([c,x])=>{ if (!state[c].some(y=>y.id===x.id)) enqueue(c,x,true); }); }
      lsSave(); ui.confirm=null; render(); toast("Podaci vraćeni iz kopije");
    }catch(e){ toast("Ovo nije ispravna rezervna kopija."); }
  };
  rd.readAsText(file);
}
const settings = () => {
  const s = state.settings.find(x=>x.id==="main") || {};
  const fx = state.settings.find(x=>x.id==="kurs") || {};
  return {
    lokali: s.lokali && s.lokali.length===3 ? s.lokali : ["Lokal 1","Lokal 2","Lokal 3"],
    kategorije: s.kategorije && s.kategorije.length ? s.kategorije : DEFAULT_CATS,
    kurs: fx.rates || {}, kursDatum: fx.datum || ""
  };
};
const saveMain = patch => { const s=settings(); return put("settings","main",{lokali:s.lokali,kategorije:s.kategorije,...patch}); };
const rate = cur => cur==="RSD" ? 1 : (cur==="HUF" ? (parseNum(settings().kurs.HUF)||0)/100 : parseNum(settings().kurs[cur])||0);
const toRSD = (amt, cur) => (Number(amt)||0) * rate(cur||"RSD");

/* ---------- icons ---------- */
const IC = {
  pregled:'<path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/>',
  pazar:'<path d="M3 6h18v12H3zM3 10h18M7 14h4"/>',
  troskovi:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>',
  gotovina:'<path d="M2 7h20v10H2zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M6 12h.01M18 12h.01"/>',
  dugovi:'<path d="M1 5h13v11H1zM14 8h4l3 3v5h-7M5.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3M17.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3"/>',
  krediti:'<path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>',
  radnici:'<path d="M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6M22 19v-1a4 4 0 0 0-3-3.9M16 4.1a4 4 0 0 1 0 7.8"/>',

function pazarSums(month){
  const s = settings(); const sums=[0,0,0];
  state.pazari.filter(p=>p.datum && p.datum.startsWith(month)).forEach(p=>{ sums[p.lokal]=(sums[p.lokal]||0)+(Number(p.iznos)||0); });
  return {sums, total:sums.reduce((a,b)=>a+b,0), names:s.lokali};
}
function costSums(month){
  const by={}; let total=0;
  state.troskovi.filter(t=>t.datum && t.datum.startsWith(month)).forEach(t=>{ by[t.kategorija]=(by[t.kategorija]||0)+(Number(t.iznos)||0); total+=Number(t.iznos)||0; });
  return {by,total};
}
function daily(arr, month, f=()=>true){
  const v = new Array(daysIn(month)).fill(0);
  arr.forEach(x=>{ if (x.datum && x.datum.startsWith(month) && f(x)) v[+x.datum.slice(8)-1] += Number(x.iznos)||0; });
  return v;
}
function supplierDebt(sid){
  const r = state.racuni.filter(x=>x.dobavljac===sid), u = state.uplate.filter(x=>x.dobavljac===sid);
  const byCur = {};
  r.forEach(x=>{ const c=x.valuta||"RSD"; byCur[c]=(byCur[c]||0)+(Number(x.iznos)||0); });
  u.forEach(x=>{ const c=x.valuta||"RSD"; byCur[c]=(byCur[c]||0)-(Number(x.iznos)||0); });
  const rsd = Object.entries(byCur).reduce((a,[c,v])=>a+toRSD(v,c),0);
  return {byCur, rsd, racuni:r, uplate:u};
}
function totalDebt(){ return state.dobavljaci.reduce((a,d)=>a+supplierDebt(d.id).rsd,0); }
/* Per-invoice state (in RSD): payments tied to an invoice settle it first; general payments and any
   overpayment settle the oldest invoices first. */
function invoiceState(sid){
  const R = state.racuni.filter(r=>r.dobavljac===sid).sort((a,b)=>(a.datum||"").localeCompare(b.datum||"")||(a.kreirano||0)-(b.kreirano||0));
  const left = new Map(R.map(r=>[r.id, toRSD(r.iznos,r.valuta)])); let pool = 0;
  state.uplate.filter(u=>u.dobavljac===sid).forEach(u=>{ const v = toRSD(u.iznos,u.valuta);
    if (u.racun && left.has(u.racun)){ const take = Math.min(v, left.get(u.racun)); left.set(u.racun, left.get(u.racun)-take); pool += v-take; } else pool += v; });
  R.forEach(r=>{ const take = Math.min(pool, left.get(r.id)); left.set(r.id, left.get(r.id)-take); pool -= take; });
  const t = today();
  return Object.fromEntries(R.map(r=>{ const full = toRSD(r.iznos,r.valuta), l = left.get(r.id);
    const st = l<=0.5 ? "placeno" : (r.dospece && r.dospece<t) ? "kasni" : l<full-0.5 ? "delimicno" : "otvoreno";
    return [r.id, {full, left:l, paid:full-l, st}]; }));
}
const lateInvoices = sid => { const st = invoiceState(sid); return state.racuni.filter(r=>r.dobavljac===sid && st[r.id] && st[r.id].st==="kasni"); };

/* Installments left: one payment per month on `dan`, from today up to and including `istek`. */
function loanPlan(o){
  const t = today(), end = o.istek || "", day = Math.min(Math.max(+o.dan||1,1),31);
  let [y,m] = t.split("-").map(Number), n = 0, next = "", thisM = 0;
  if (end) for (let k=0; k<600; k++){
    const d = y+"-"+pad(m)+"-"+pad(Math.min(day, new Date(y,m,0).getDate()));
    if (d > end) break;
    if (k===0) thisM = Number(o.rata)||0;
    if (d >= t){ n++; if(!next) next = d; }
    if (++m > 12){ m=1; y++; }
  }
  const ostalo = n*(Number(o.rata)||0);
  return {n, next, ostalo, ostaloRSD: toRSD(ostalo, o.valuta), rataRSD: toRSD(o.rata, o.valuta), thisMRSD: toRSD(thisM, o.valuta)};
}
const loans = () => [...state.krediti.map(k=>({...k,_t:"krediti",naziv:k.banka,opis:"Kredit"})), ...state.lizing.map(l=>({...l,_t:"lizing",naziv:l.kuca,opis:l.namena||"Lizing"}))]
  .map(o=>({...o, p:loanPlan(o)}));

function alerts(){
  const t = today(), soon = addDays(t,3), out = [];
  state.dobavljaci.forEach(d=>{ const x=supplierDebt(d.id); if (x.rsd>0.5){ const late=lateInvoices(d.id);
    if (late.length) out.push({c:"red", ic:"dugovi", t:`${d.naziv}: račun kasni`, s:`${late.length} račun(a) posle roka · dug ${fmt0(x.rsd)} RSD`, tab:"dugovi"}); } });
  loans().forEach(o=>{ if (o.p.next && o.p.next<=soon) out.push({c:"purple", ic:"krediti", t:`Rata: ${o.naziv}`, s:`${o.p.next===t?"danas":fdate(o.p.next)} · ${fmt(o.rata)} ${o.valuta||"RSD"}`, tab:"krediti"}); });
  const unpaid = state.gotovina.filter(g=>g.status!=="isplaceno");
  if (unpaid.length) out.push({c:"yellow", ic:"gotovina", t:`Gotovina za isplatu: ${fmt0(sum(unpaid,g=>g.iznos))} RSD`, s:`${unpaid.length} neisplaćen(ih) račun(a)`, tab:"gotovina"});
  monthlyDue(thisMonth()).filter(x=>x.kind==="pon" && !x.done && x.due<=soon).forEach(x=>out.push({c:"orange", ic:"troskovi", t:`Za plaćanje: ${x.naziv}`, s:`${x.due<t?"dospelo":x.due===t?"danas":fdate(x.due)} · ${fmt0(x.iznos)} RSD`, tab:"troskovi"}));
  if (hasData()){ const d = backupAge(); if (d==null || d>=7) out.push({c:"yellow", ic:"podesavanja", t:"Napravite rezervnu kopiju", s:d==null?"kopija još nije napravljena":`poslednja pre ${d} dana`, tab:"podesavanja"}); }
  state.zadaci.filter(z=>!z.gotovo && z.rok && z.rok<=t).forEach(z=>out.push({c:"orange", ic:"zadaci", t:z.tekst, s:z.rok<t?`kasni · rok ${fdate(z.rok)}`:"rok danas", tab:"zadaci"}));
  return out;
}

/* ---------- charts ---------- */
function smoothPath(pts, H){
  if (!pts.length) return "";
  const cl = v => Math.min(Math.max(v,0),H);
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    d += ` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${cl(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${cl(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
const niceMax = v => { if (v<=0) return 1; const p=10**Math.floor(Math.log10(v)), n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; };
let gid = 0;
function spark(vals, hex){
  const W=100, H=40, max=Math.max(...vals,0), min=Math.min(...vals,0), span=(max-min)||1, id="sg"+(gid++);
  const pts = vals.map((v,i)=>[vals.length>1?i/(vals.length-1)*W:0, H-4-(v-min)/span*(H-10)]);
  const line = smoothPath(pts,H);
  return `<svg class="sp" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${hex}" stop-opacity=".45"/><stop offset="1" stop-color="${hex}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L${W},${H} L0,${H} Z" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${hex}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
/* `upto` = number of days already elapsed; the x axis still spans the whole month. */
function areaChart(series, n, upto=n){
  const W=600, H=200, max=niceMax(Math.max(1,...series.flatMap(s=>s.vals.slice(0,upto))));
  const x = i => n>1 ? i/(n-1)*W : 0, y = v => H - v/max*H;
  const grid = [0,.25,.5,.75,1].map(f=>`<line x1="0" x2="${W}" y1="${(H*f).toFixed(1)}" y2="${(H*f).toFixed(1)}" stroke="#1E2A44" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>`).join("");
  const paths = series.map((s,k)=>{ const id="ag"+(gid++); const vals=s.vals.slice(0,Math.max(upto,1)); const line=smoothPath(vals.map((v,i)=>[x(i),y(v)]),H); const xe=x(vals.length-1).toFixed(1);
    return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.hex}" stop-opacity="${k?".18":".35"}"/><stop offset="1" stop-color="${s.hex}" stop-opacity="0"/></linearGradient></defs>
      <path d="${line} L${xe},${H} L0,${H} Z" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${s.hex}" stroke-width="2.2" vector-effect="non-scaling-stroke"/>`; }).join("");
  const step = Math.ceil(n/10), xl=[]; for (let i=0;i<n;i+=step) xl.push(i+1); if (xl[xl.length-1]!==n) xl.push(n);
  return `<div class="chart"><div class="plot">${[1,.75,.5,.25,0].map((f,i)=>`<span class="ylab" style="top:${i*25}%">${short(max*f)}</span>`).join("")}
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Pazar po danima">${grid}${paths}</svg></div>
    <div class="xlab">${xl.map(d=>`<span>${pad(d)}</span>`).join("")}</div></div>`;
}
const pct = (cur, prev, goodUp=true) => { if (!prev) return ""; const p=(cur-prev)/Math.abs(prev)*100; const up=p>=0;
  return `<span class="badge ${up===goodUp?"up":"down"}">${up?"+":"−"}${fmt(Math.abs(p),1)}%</span>`; };

/* Monthly obligations: recurring costs and loan installments, entered as costs with one click.
   Each shows only from the month it was added in. */
function monthlyDue(month){
  const out = [], since = x => !x.kreirano || new Date(x.kreirano).toISOString().slice(0,7) <= month;
  state.ponavljajuci.filter(since).forEach(p=>{ const due = month+"-"+pad(Math.min(+p.dan||1, daysIn(month)));
    out.push({kind:"pon", id:p.id, naziv:p.naziv, kategorija:p.kategorija, lokal:p.lokal, iznos:Number(p.iznos)||0, due,
      done:state.troskovi.find(x=>x.pon===p.id && x.datum && x.datum.startsWith(month))}); });
  loans().filter(since).forEach(o=>{ const due = month+"-"+pad(Math.min(+o.dan||1, daysIn(month))); if (!o.istek || due>o.istek) return;
    out.push({kind:"rata", id:o.id, naziv:"Rata – "+o.naziv, kategorija:"Krediti i lizing", lokal:"", iznos:Math.round(o.p.rataRSD*100)/100,
      orig:o.valuta&&o.valuta!=="RSD"?`${fmt(o.rata)} ${o.valuta}`:"", due, done:state.troskovi.find(x=>x.rata===o.id && x.datum && x.datum.startsWith(month))}); });
  return out.sort((a,b)=>a.due.localeCompare(b.due));
}
async function enterDue(items){
  const s = settings(), need = [...new Set(items.map(x=>x.kategorija))].filter(k=>!s.kategorije.includes(k));
  if (need.length) await saveMain({kategorije:[...s.kategorije, ...need]});
  const t = today();
  for (const x of items) await put("troskovi", uid(), {datum:x.due<=t?x.due:t, kategorija:x.kategorija, lokal:x.lokal??"", iznos:x.iznos, opis:x.naziv, [x.kind==="pon"?"pon":"rata"]:x.id, kreirano:Date.now()});
  toast(items.length===1 ? "Upisano u troškove" : `Upisano ${items.length} troškova`);
}

/* Closing the month's pay: one record per worker and month; the full salary is also written as a cost
   ("Plate"), since advances were cash out of the same salary. */
const isplata = (rid, month) => state.isplate.find(i=>i.radnik===rid && i.mesec===month);
const workedIn = (r, month) => (!r.prijava || r.prijava <= month+"-31") && (!r.odjava || r.odjava >= month+"-01");
async function payOut(rids, month){
  const s = settings(); if (!s.kategorije.includes("Plate")) await saveMain({kategorije:[...s.kategorije,"Plate"]});
  for (const rid of rids){ const r = state.radnici.find(x=>x.id===rid); if (!r || isplata(rid,month)) continue;
    const av = avansiMonth(rid, month), id = uid(), plata = Number(r.plata)||0;
    await put("isplate", id, {radnik:rid, mesec:month, plata, avansi:av, iznos:Math.round((plata-av)*100)/100, datum:today(), kreirano:Date.now()});
    await put("troskovi", uid(), {datum:today(), kategorija:"Plate", lokal:"", iznos:plata, opis:`Plata ${r.ime} – ${MONTHS[+month.slice(5)-1]}`, isplata:id, kreirano:Date.now()});
  }
  toast(rids.length===1 ? "Plata isplaćena" : "Plate isplaćene");
}

/* ---------- asistent ----------
   Built-in: understands common Serbian questions about the book (debts, advances, takings, costs, cash, loans,
   contacts) by keywords and fuzzy name matching, offline. Optional: anything it cannot answer goes to Claude
   with the user's own API key, kept only on this device (never in backups). */
const norm = s => String(s||"").toLowerCase().replace(/đ/g,"dj").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
const NAME_STOP = new Set(["doo","d","o","ad","str","szr","firma","i","the"]);
// Share of the name's words found in the question; Serbian case endings are tolerated by comparing word stems.
function nameScore(qWords, name){
  const nw = norm(name).split(" ").filter(w=>w.length>=3 && !NAME_STOP.has(w)); if (!nw.length) return 0;
  let hit = 0;
  nw.forEach(w=>{ const stem = w.length>5 ? w.slice(0,w.length-2) : w.slice(0,Math.max(3,w.length-1));
    if (qWords.some(x=>x.startsWith(stem) || (x.length>=4 && w.startsWith(x)))) hit++; });
  return hit ? hit/nw.length + hit*0.01 : 0;
}
function findEntity(qWords){
  const s = settings(), cands = [
    ...state.dobavljaci.map(d=>({type:"dob", obj:d, name:d.naziv})),
    ...state.radnici.map(r=>({type:"rad", obj:r, name:r.ime})),
    ...state.imenik.map(c=>({type:"kon", obj:c, name:c.ime})),
    ...loans().map(o=>({type:"kred", obj:o, name:o.naziv+" "+(o.namena||"")})),

  try{
    const resp = await client.beta.messages.create({
      model: "claude-opus-5-5", max_tokens: 16000,
      betas: ["server-side-fallback-2026-07-01"], fallbacks: "default",
      output_config: {effort: "low"},
      system: "Ti si asistent u aplikaciji Knjiga lokala za vlasnika restorana/kafića. Odgovaraj kratko, na srpskom latinicom, isključivo na osnovu podataka ispod. "

    if (err instanceof Anthropic.APIConnectionError) return "Nema veze sa internetom.";

const synced = (col, id) => !LOCAL_ONLY.has(col+"/"+id);
function enqueue(col, doc, deleted){
  if (!cloud.firma || !doc || !synced(col, doc.id)) return;
  const key = col+"/"+doc.id; queue = queue.filter(q=>q.id!==key); queue.push({id:key, kolekcija:col, podaci:doc, obrisano:!!deleted});
  saveQueue(); setCloudStatus(); flushSoon();
}
let flushT; const flushSoon = () => { clearTimeout(flushT); flushT = setTimeout(flush, 400); };
async function flush(){
  if (!cloud.sb || !cloud.user || !cloud.firma || !queue.length || cloud.busy) return;
  if (!navigator.onLine){ setCloudStatus("offline"); return; }
  cloud.busy = true; const batch = queue.slice(0, 200);
  let error;
  try{ ({error} = await cloud.sb.from("zapisi").upsert(batch.map(q=>({firma:cloud.firma, id:q.id, kolekcija:q.kolekcija, podaci:q.podaci, obrisano:q.obrisano})))); }
  catch(e){ error = {message:String(e && e.message || e)}; }
  cloud.busy = false;
  if (error){
    // A change this member may not make would block the queue forever; drop it and say so.
    if (/row-level security|permission denied|42501/i.test(error.message||"")){ queue = queue.filter(q=>!batch.includes(q)); saveQueue(); toast("Nemate pravo da sačuvate ovaj unos u zajedničku bazu."); }
    setCloudStatus("error", error.message); return;
  }
  queue = queue.filter(q=>!batch.includes(q)); saveQueue(); setCloudStatus("ok");
  if (queue.length) flushSoon();
}
function applyRow(r){
  const col = r.kolekcija, d = r.podaci;
  if (r.izmenjeno && r.izmenjeno > cloud.lastSync) cloud.lastSync = r.izmenjeno;
  if (!state[col] || !d || !d.id || !synced(col, d.id)) return;
  if (queue.some(q=>q.id===col+"/"+d.id)) return;   // our unsent change wins until it is sent
  const arr = state[col], i = arr.findIndex(x=>x.id===d.id);
  if (r.obrisano){ if (i>=0) arr.splice(i,1); } else if (i>=0) arr[i] = d; else arr.push(d);
}
let renderT; const renderSoon = () => { clearTimeout(renderT); renderT = setTimeout(render, 250); };
async function pullAll(){
  const rows = [];
  for (let from = 0; ; from += 1000){
    const {data, error} = await cloud.sb.from("zapisi").select("id,kolekcija,podaci,obrisano,izmenjeno").eq("firma", cloud.firma).eq("obrisano", false).order("id").range(from, from+999);
    if (error) throw error; rows.push(...data); if (data.length < 1000) break;
  }
  const keep = state.settings.filter(s=>!synced("settings", s.id));
  COLS.forEach(c=>state[c] = []); state.settings = keep; cloud.lastSync = "";
  rows.forEach(applyRow);
  queue.forEach(q=>{ const arr = state[q.kolekcija]; if (!arr) return; const i = arr.findIndex(x=>x.id===q.podaci.id);
    if (q.obrisano){ if (i>=0) arr.splice(i,1); } else if (i>=0) arr[i] = q.podaci; else arr.push(q.podaci); });
  setCloudCfg({lastSync:cloud.lastSync}); lsSave(); render();
}
async function pullChanges(){
  if (!cloud.sb || !cloud.firma || !navigator.onLine) return;
  const since = cloud.lastSync || cloudCfg().lastSync; if (!since) return pullAll();
  const {data, error} = await cloud.sb.from("zapisi").select("id,kolekcija,podaci,obrisano,izmenjeno").eq("firma", cloud.firma).gt("izmenjeno", since).order("izmenjeno").limit(5000);
  if (error){ setCloudStatus("error", error.message); return; }
  if (data.length){ data.forEach(applyRow); setCloudCfg({lastSync:cloud.lastSync}); lsSave(); renderSoon(); }
}
function setCloudStatus(st, msg){
  if (st) cloud.status = st; if (msg!==undefined) cloud.msg = msg;
  const el = $("#sync"); if (!el) return;
  const txt = !cloud.firma ? "Sačuvano na uređaju"
    : cloud.sb && !cloud.user ? `Niste prijavljeni${queue.length?` · čeka ${queue.length}`:""}`
    : cloud.status==="offline" ? `Bez interneta${queue.length?` · čeka ${queue.length}`:""}`
    : cloud.status==="error" ? "Greška u sinhronizaciji"
    : queue.length ? `Šalje se ${queue.length}…` : `Povezano · ${cloud.naziv||"firma"}`;
  el.innerHTML = `<i style="background:${!cloud.firma||cloud.user&&cloud.status==="ok"&&!queue.length?"var(--green)":cloud.status==="error"?"var(--red)":"var(--yellow)"}"></i>${esc(txt)}`;
}
async function cloudInit(){
  const c = cloudCfg(); if (!c.url || !c.key) return;
  try{
    const {createClient} = await import(SB_URL);
    cloud.sb = createClient(c.url, c.key, {auth:{persistSession:true, autoRefreshToken:true, storageKey:LS+"-auth"}});
    const {data} = await cloud.sb.auth.getSession(); cloud.user = data.session ? data.session.user : null;
    cloud.sb.auth.onAuthStateChange((ev, s)=>{ cloud.user = s ? s.user : null; });
    if (cloud.user) await loadMembership();
  }catch(e){ setCloudStatus("error", "Biblioteka za bazu nije učitana (internet?)"); }
  render();
}
async function loadMembership(){
  const {data, error} = await cloud.sb.from("clanovi").select("firma,uloga,lokal,ime,firme(naziv)").eq("korisnik", cloud.user.id);
  if (error){ setCloudStatus("error", error.message); return; }
  const want = cloud.joined || cloudCfg().firma, m = data.find(x=>x.firma===want) || data[0]; cloud.joined = null;
  if (m) await connectFirma(m);
}
async function connectFirma(m){
  const isNewHere = cloudCfg().firma !== m.firma;
  // Joining replaces this phone's data with the firm's; keep the previous local data aside, just in case.
  if (isNewHere && hasData()){ try{ localStorage.setItem(LS+"-pre-baze", JSON.stringify(state)); }catch(e){} queue = []; saveQueue(); }
  Object.assign(cloud, {firma:m.firma, uloga:m.uloga, lokal:m.lokal, naziv:(m.firme&&m.firme.naziv)||""});
  setCloudCfg({firma:m.firma, uloga:m.uloga, lokal:m.lokal, naziv:cloud.naziv}); if (isNewHere) setCloudCfg({lastSync:""});
  try{ await flush(); await pullAll(); }catch(e){ setCloudStatus("error", e.message||String(e)); }
  subscribe(); setCloudStatus("ok");
  if (!allowedTab(ui.tab)) setTab(cloud.uloga==="smena" ? "pazar" : "pregled");
  if (cloud.uloga==="vlasnik") loadMembers();
}
function subscribe(){
  if (cloud.chan) cloud.sb.removeChannel(cloud.chan);
  cloud.chan = cloud.sb.channel("zapisi-"+cloud.firma)
    .on("postgres_changes", {event:"*", schema:"public", table:"zapisi", filter:"firma=eq."+cloud.firma}, p=>{ if (p.new && p.new.id){ applyRow(p.new); setCloudCfg({lastSync:cloud.lastSync}); lsSave(); renderSoon(); } })
    .subscribe(st=>{ if (st==="SUBSCRIBED") pullChanges(); });
}
async function loadMembers(){
  const [a, b] = await Promise.all([
    cloud.sb.from("clanovi").select("korisnik,ime,email,uloga,lokal").eq("firma", cloud.firma).order("napravljeno"),
    cloud.sb.from("pozivnice").select("kod,uloga,lokal,ime,napravljeno").eq("firma", cloud.firma).is("iskoristio", null).order("napravljeno", {ascending:false})
  ]);
  cloud.members = a.data || []; cloud.invites = b.data || []; if (ui.tab==="podesavanja") render();
}
const AUTH_ERR = m => /Invalid login/i.test(m) ? "Pogrešan mejl ili lozinka." : /already registered|already been registered/i.test(m) ? "Nalog sa tim mejlom već postoji. Prijavite se."
  : /Password should be/i.test(m) ? "Lozinka mora imati bar 6 znakova." : /Email not confirmed/i.test(m) ? "Potvrdite nalog preko linka koji je stigao na mejl."
  : /valid email|invalid format/i.test(m) ? "Mejl adresa nije ispravna." : /Pozivnica ne važi/.test(m) ? "Pozivnica ne važi (iskorišćena, istekla ili pogrešno prepisana)." : m;
async function signIn(email, pass){
  const {data, error} = await cloud.sb.auth.signInWithPassword({email, password:pass});
  if (error){ toast(AUTH_ERR(error.message)); return false; }
  cloud.user = data.user; await loadMembership(); render(); return true;
}
async function signUp(email, pass, ime){
  const {data, error} = await cloud.sb.auth.signUp({email, password:pass, options:{data:{ime}}});
  if (error){ toast(AUTH_ERR(error.message)); return false; }
  if (!data.session){ toast("Nalog je napravljen. Potvrdite ga preko linka na mejlu, pa se prijavite."); cloud.mode = "login"; render(); return false; }
  cloud.user = data.user; render(); return true;
}
async function createFirm(naziv){
  const {data:f, error} = await cloud.sb.rpc("napravi_firmu", {naziv});
  if (error){ toast(AUTH_ERR(error.message)); return; }
  // The owner's existing data becomes the firm's data.
  cloud.uploading = true; cloud.firma = f;
  COLS.forEach(c=>state[c].forEach(x=>enqueue(c, x)));
  for (let i = 0; i < 50 && queue.length; i++){ await flush(); if (cloud.status==="error") break; }
  cloud.uploading = false; setCloudCfg({firma:f});   // this phone's data is the firm's: nothing to set aside
  if (queue.length){ toast("Deo podataka nije poslat. Pokušaće ponovo kad bude interneta."); }
  await loadMembership(); toast("Firma je napravljena. Podaci su sada u zajedničkoj bazi."); render();
}
async function joinFirm(kod, ime){
  const {data:f, error} = await cloud.sb.rpc("pridruzi_se", {kod, ime});
  if (error){ toast(AUTH_ERR(error.message)); return; }
  cloud.joined = f; await loadMembership(); toast("Povezani ste sa firmom "+(cloud.naziv||"")); render();
}
async function signOut(){
  if (cloud.chan) cloud.sb.removeChannel(cloud.chan);
  await cloud.sb.auth.signOut();
  // The firm's data stays in the base; this phone forgets it.
  const keep = state.settings.filter(s=>!synced("settings", s.id)); COLS.forEach(c=>state[c] = []); state.settings = keep;
  queue = []; saveQueue(); setCloudCfg({firma:"", lastSync:"", uloga:null, lokal:null, naziv:""});
  Object.assign(cloud, {user:null, firma:null, uloga:null, lokal:null, naziv:"", members:[], invites:[], chan:null});
  lsSave(); setCloudStatus("ok"); setTab("podesavanja"); toast("Odjavljeni ste");
}

/* ---------- podešavanja: PIN, rezervne kopije, izveštaj, obaveštenja ---------- */
const META_LS = LS+"-meta", PIN_LS = LS+"-pin";
const meta = () => { try{ return JSON.parse(localStorage.getItem(META_LS)||"{}"); }catch(e){ return {}; } };
const setMeta = patch => { try{ localStorage.setItem(META_LS, JSON.stringify({...meta(), ...patch})); }catch(e){} };
const hasData = () => ["pazari","troskovi","racuni","radnici","gotovina","krediti","lizing","imenik"].some(c=>state[c].length);
const daysSince = ts => ts ? Math.floor((Date.now()-ts)/864e5) : null;
const bridge = name => window.AndroidBridge && typeof window.AndroidBridge[name] === "function";
function backupAge(){ const m = meta(); return daysSince(Math.max(m.manual||0, m.auto||0) || 0); }
function backupBanner(){
  if (!hasData()) return ""; const d = backupAge(); if (d!=null && d<7) return "";
  return `<div class="banner"><span>💾 <b>Rezervna kopija</b> ${d==null?"još nije napravljena":`je napravljena pre ${d} dana`}. Ako se telefon izgubi ili pokvari, podaci nestaju.</span><button class="btn small" data-export>Napravi kopiju</button></div>`;
}
// Android: once a week a copy is written to Downloads/Knjiga lokala without asking.
function autoBackup(){
  if (!bridge("saveBackup") || !hasData() || daysSince(meta().auto||0) < 7) return;
  try{ if (window.AndroidBridge.saveBackup("knjiga-lokala-"+today()+".json", backupJson())){ setMeta({auto:Date.now()}); toast("Automatska kopija sačuvana u Preuzimanja › Knjiga lokala"); } }catch(e){}
}

async function pinHash(p){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("knjiga-lokala:"+p)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
const pinInfo = () => { try{ return JSON.parse(localStorage.getItem(PIN_LS)||"null"); }catch(e){ return null; } };
const lockUi = {buf:"", fails:0, waitUntil:0, hiddenAt:0, forgot:false, wipeAsk:false};
function showLock(){ if (!pinInfo()) return; Object.assign(lockUi, {buf:"", forgot:false, wipeAsk:false}); $("#lock").hidden = false; drawLock(); }
function drawLock(){
  const p = pinInfo(), L = $("#lock"); if (!p) return;
  if (lockUi.forgot){ L.innerHTML = `<h2>Zaboravljen PIN</h2><p>PIN ne može da se vrati. Jedino rešenje je da obrišete sve podatke sa ovog uređaja, pa ih vratite iz rezervne kopije (Podešavanja › Vrati iz kopije).</p>
    ${lockUi.wipeAsk?`<p><b>Sigurno? Brisanje se ne može poništiti.</b></p><div class="toolbar"><button class="btn danger" data-wipe>Da, obriši sve</button><button class="btn ghost" data-lockback>Ne</button></div>`
      :`<div class="toolbar"><button class="btn danger" data-wipeask>Obriši podatke</button><button class="btn ghost" data-lockback>Nazad</button></div>`}`; return; }
  L.innerHTML = `<div class="brand" style="padding:0"><span class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/></svg></span>Knjiga lokala</div>
    <h2>Unesite PIN</h2><div class="pdots" id="pdots">${Array.from({length:p.len},(_,i)=>`<i class="${i<lockUi.buf.length?"on":""}"></i>`).join("")}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-pin="${n}">${n}</button>`).join("")}<button class="ghost" data-pinforgot>Zaboravili ste?</button><button data-pin="0">0</button><button class="ghost" data-pindel aria-label="Obriši cifru">⌫</button></div>`;
}
async function pinKey(d){
  if (Date.now() < lockUi.waitUntil){ toast("Sačekajte malo pa pokušajte ponovo"); return; }
  const p = pinInfo(); if (!p || lockUi.buf.length >= p.len) return;
  lockUi.buf += d; drawLock(); if (lockUi.buf.length < p.len) return;
  if (await pinHash(lockUi.buf) === p.h){ $("#lock").hidden = true; lockUi.buf = ""; lockUi.fails = 0; return; }
  lockUi.buf = ""; drawLock(); $("#pdots").classList.add("bad");
  if (++lockUi.fails >= 5){ lockUi.waitUntil = Date.now()+30000; lockUi.fails = 0; toast("Previše pokušaja. Sačekajte 30 sekundi."); } else toast("Pogrešan PIN");
}
function wipeAll(){ try{ Object.keys(localStorage).filter(k=>k.startsWith(LS)).forEach(k=>localStorage.removeItem(k)); }catch(e){} location.reload(); }

/* Report for the accountant: one month in an Excel workbook (SheetJS, loaded only when needed). */
const XLSX_URL = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/xlsx.mjs";
function saveB64(name, mime, b64){
  if (window.AndroidBridge){ if (bridge("shareBase64")) window.AndroidBridge.shareBase64(name, mime, b64); else toast("Ažurirajte aplikaciju na najnoviju verziju za izvoz u Excel."); return; }
  const bin = atob(b64), bytes = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([bytes],{type:mime})); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast("Izveštaj sačuvan: "+name);
}
async function exportExcel(month){
  let X; try{ X = await import(XLSX_URL); }catch(e){ toast("Za izveštaj je potreban internet."); return; }
  const s = settings(), inM = x => x.datum && x.datum.startsWith(month), lok = i => i===""||i==null ? "Zajedničko" : s.lokali[i];
  const P = state.pazari.filter(inM).sort((a,b)=>a.datum.localeCompare(b.datum)), T = state.troskovi.filter(inM).sort((a,b)=>a.datum.localeCompare(b.datum));
  const split = paySplit(P), byLok = s.lokali.map((n,i)=>sum(P.filter(p=>p.lokal===i),p=>p.iznos)), byKat = {}; T.forEach(t=>byKat[t.kategorija]=(byKat[t.kategorija]||0)+(Number(t.iznos)||0));
  const pt = sum(P,p=>p.iznos), tt = sum(T,t=>t.iznos), monthEnd = month+"-"+pad(daysIn(month));
  const W = workedIn, plate = state.radnici.filter(r=>W(r,month)).map(r=>{ const i = isplata(r.id,month), av = avansiMonth(r.id,month);
    return [r.ime, r.mesto||"", i?i.plata:Number(r.plata)||0, av, i?i.iznos:(Number(r.plata)||0)-av, i?fdate(i.datum):"nije isplaćeno"]; });
  const sheet = (rows, widths) => { const ws = X.utils.aoa_to_sheet(rows); ws["!cols"] = widths.map(w=>({wch:w})); return ws; };
  const wb = X.utils.book_new();
  X.utils.book_append_sheet(wb, sheet([
    ["Knjiga lokala – izveštaj za "+mname(month)], [],
    ["Pazar ukupno", pt], ["  gotovina", split.g], ["  kartice", split.k], ...(split.n?[["  nepodeljeno", split.n]]:[]),
    ...s.lokali.map((n,i)=>["  "+n, byLok[i]]), [],
    ["Troškovi ukupno", tt], ...Object.entries(byKat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>["  "+k, v]), [],
    ["Razlika (pazar − troškovi)", pt-tt], [],
    ["Plate (isplaćeno)", sum(plate,r=>r[5]==="nije isplaćeno"?0:r[4])], ["Avansi u mesecu", sum(plate,r=>r[3])],
    ["Dug dobavljačima na kraju meseca", Math.round(debtAt(monthEnd)*100)/100],
    ["Gotovinski računi isplaćeni", sum(state.gotovina.filter(g=>g.status==="isplaceno" && (g.isplaceno||g.datum||"").startsWith(month)),g=>g.iznos)]
  ], [34,16]), "Rezime");
  X.utils.book_append_sheet(wb, sheet([["Datum","Lokal","Smena","Gotovina","Kartice","Ukupno","Napomena"],
    ...P.map(p=>[fdate(p.datum), s.lokali[p.lokal], p.smena?p.smena+".":"", p.gotovina??"", p.kartica??"", Number(p.iznos)||0, p.napomena||""])], [12,16,8,12,12,12,24]), "Pazar");
  X.utils.book_append_sheet(wb, sheet([["Datum","Vrsta","Lokal","Opis","Iznos"], ...T.map(t=>[fdate(t.datum), t.kategorija, lok(t.lokal), t.opis||"", Number(t.iznos)||0])], [12,18,16,30,12]), "Troškovi");
  X.utils.book_append_sheet(wb, sheet([["Radnik","Radno mesto","Plata","Avansi","Isplaćeno","Datum isplate"], ...plate], [24,16,12,12,12,16]), "Plate");
  const rad = Object.fromEntries(state.radnici.map(r=>[r.id,r.ime])), dob = Object.fromEntries(state.dobavljaci.map(d=>[d.id,d.naziv]));
  X.utils.book_append_sheet(wb, sheet([["Datum","Radnik","Iznos","Napomena"], ...state.avansi.filter(inM).map(a=>[fdate(a.datum), rad[a.radnik]||"", Number(a.iznos)||0, a.napomena||""])], [12,24,12,24]), "Avansi");
  X.utils.book_append_sheet(wb, sheet([["Datum","Dobavljač","Stavka","Broj","Iznos","Valuta","U dinarima","Rok"],
    ...[...state.racuni.filter(inM).map(r=>[r.datum, dob[r.dobavljac]||"", "Račun", r.broj||"", Number(r.iznos)||0, r.valuta||"RSD", Math.round(toRSD(r.iznos,r.valuta)*100)/100, fdate(r.dospece)]),
       ...state.uplate.filter(inM).map(u=>[u.datum, dob[u.dobavljac]||"", "Uplata", "", Number(u.iznos)||0, u.valuta||"RSD", Math.round(toRSD(u.iznos,u.valuta)*100)/100, ""])]
      .sort((a,b)=>a[0].localeCompare(b[0])).map(r=>[fdate(r[0]), ...r.slice(1)])], [12,24,10,14,12,8,14,12]), "Dobavljači");
  X.utils.book_append_sheet(wb, sheet([["Datum","Kome / za šta","Iznos","Status","Napomena"], ...state.gotovina.filter(inM).map(g=>[fdate(g.datum), g.primalac, Number(g.iznos)||0, g.status==="isplaceno"?"isplaćeno":"neisplaćeno", g.napomena||""])], [12,28,12,14,24]), "Gotovina");
  saveB64(`knjiga-lokala-izvestaj-${month}.xlsx`, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", X.write(wb, {type:"base64", bookType:"xlsx"}));
}

/* Android reminders: the next five weeks of due dates are handed to the app, which schedules notifications. */
const strHash = s => { let h = 0; for (const c of s) h = (h*31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
function computeReminders(){
  const now = Date.now(), until = now + 35*864e5, out = [];
  const add = (key, d, hour, title, text) => { const ms = new Date(d+"T"+pad(hour)+":00:00").getTime(); if (ms>now && ms<until) out.push({id:strHash(key+"|"+d+"|"+hour), at:ms, title, text}); };
  loans().forEach(o=>{ if (!o.p.next) return; const txt = `${o.naziv}: ${fmt(o.rata)} ${o.valuta||"RSD"}`;
    add("rata"+o.id, addDays(o.p.next,-1), 9, "Sutra dospeva rata", txt); add("rata"+o.id, o.p.next, 9, "Danas dospeva rata", txt); });
  state.dobavljaci.forEach(d=>{ const st = invoiceState(d.id);
    state.racuni.filter(r=>r.dobavljac===d.id && r.dospece && st[r.id] && st[r.id].left>0.5).forEach(r=>{ const txt = `${d.naziv}${r.broj?" · "+r.broj:""}: ostalo ${fmt0(st[r.id].left)} RSD`;
      add("rac"+r.id, addDays(r.dospece,-1), 9, "Sutra ističe rok za račun", txt); add("rac"+r.id, r.dospece, 9, "Danas ističe rok za račun", txt); }); });
  const nm = (()=>{ let [y,m] = thisMonth().split("-").map(Number); if (++m>12){m=1;y++;} return y+"-"+pad(m); })();
  [...monthlyDue(thisMonth()), ...monthlyDue(nm)].filter(x=>x.kind==="pon" && !x.done).forEach(x=>add("pon"+x.id, x.due, 9, "Danas za plaćanje", `${x.naziv}: ${fmt0(x.iznos)} RSD`));
  state.zadaci.filter(z=>!z.gotovo && z.rok).forEach(z=>add("zad"+z.id, z.rok, 8, "Zadatak za danas", z.tekst));
  return out.sort((a,b)=>a.at-b.at).slice(0,60);
}
let remT;
function syncReminders(){ if (!bridge("scheduleReminders")) return; clearTimeout(remT);
  remT = setTimeout(()=>{ try{ window.AndroidBridge.scheduleReminders(JSON.stringify(computeReminders())); }catch(e){} }, 1500); }

function renderResults(){
  const q = $("#q").value.trim().toLowerCase(), box = $("#results");
  if (q.length < 2){ box.hidden = true; return; }
  const hit = s => String(s||"").toLowerCase().includes(q);
  const res = [
    ...state.imenik.filter(c=>hit(c.ime)||hit(c.tel)||hit(c.napomena)).map(c=>({ic:"imenik",t:c.ime,s:c.tel+(c.napomena?" · "+c.napomena:""),tab:"imenik",q:c.ime})),
    ...state.dobavljaci.filter(d=>hit(d.naziv)).map(d=>({ic:"dugovi",t:d.naziv,s:"Dobavljač · dug "+fmt0(supplierDebt(d.id).rsd)+" RSD",tab:"dugovi",open:d.id})),
    ...state.radnici.filter(r=>hit(r.ime)||hit(r.mesto)).map(r=>({ic:"radnici",t:r.ime,s:"Radnik · "+(r.mesto||""),tab:"radnici",open:r.id})),
    ...state.zadaci.filter(z=>!z.gotovo && hit(z.tekst)).map(z=>({ic:"zadaci",t:z.tekst,s:"Zadatak",tab:"zadaci"})),
    ...loans().filter(o=>hit(o.naziv)||hit(o.namena)).map(o=>({ic:"krediti",t:o.naziv,s:(o._t==="krediti"?"Kredit":"Lizing")+" · "+o.p.n+" rata preostalo",tab:"krediti"}))
  ].slice(0,8);

  box.innerHTML = res.length ? res.map((r,i)=>`<button data-res="${i}">${icon(r.ic)}<span><b>${esc(r.t)}</b><small>${esc(r.s)}</small></span></button>`).join("") : `<div class="empty" style="padding:8px">Nema rezultata.</div>`;

document.addEventListener("click", e=>{
